name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem: [activerecord-minimizer, activesupport-minimizer, actionpack-minimizer, rails-minify, rubocop-minify]
        ruby: ["3.4", "4.0"]
        gemfile: [Gemfile]
        include:
          # activerecord-minimizer reaches into Active Record internals: also
          # Rails 8.0 and a pinned commit of main.
          - { gem: activerecord-minimizer, ruby: "4.0", gemfile: Gemfile.rails80 }
          - { gem: activerecord-minimizer, ruby: "4.0", gemfile: Gemfile.edge }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gem }}/${{ matrix.gemfile }}
    defaults:
      run:
        working-directory: ${{ matrix.gem }}
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: bundle exec rake test
