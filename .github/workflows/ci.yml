name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gem: [activerecord-minimizer, activesupport-minimizer, actionpack-minimizer, rails-minify, rubocop-minify]
        ruby: ["3.4", "4.0"]
    defaults:
      run:
        working-directory: ${{ matrix.gem }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: bundle exec rake test
